<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 760" font-family="'IBM Plex Sans','Segoe UI',system-ui,sans-serif">
  <defs>
    <marker id="ca" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#0f62fe"/></marker>
    <marker id="cg" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#198038"/></marker>
    <style>
      .zone{rx:12;fill:#ffffff;stroke:#c5d2e3;stroke-width:1.5}
      .lbl{font-size:12px;font-weight:700;letter-spacing:.08em;fill:#5b6b7c}
      .box{rx:8;stroke-width:1.5}
      .bt{font-size:13px;font-weight:600;fill:#161616}
      .bd{font-size:10.5px;fill:#6b7682}
      .wt{font-size:13px;font-weight:600;fill:#ffffff}
      .wd{font-size:10.5px;fill:#e8efff}
      .gd{font-size:10.5px;fill:#e3f6e8}
      .mono{font-size:10px;font-family:'IBM Plex Mono',monospace;fill:#525252}
      .flow{stroke:#0f62fe;stroke-width:1.8;fill:none;marker-end:url(#ca)}
      .gflow{stroke:#198038;stroke-width:1.8;fill:none;marker-end:url(#cg)}
    </style>
  </defs>
  <rect width="1280" height="760" fill="#fbfcfe"/>
  <text x="40" y="42" font-size="22" font-weight="700" fill="#161616">Conversational AI: two chat surfaces, two entitlements, one honesty rule</text>
  <text x="40" y="64" font-size="13" fill="#6b7682">Members ask about their own account; the company asks across the portfolio. Both are grounded server-side, return contextual follow-ups in the same call, and never invent facts.</text>

  <!-- Member assistant column -->
  <rect x="40" y="90" width="590" height="470" class="zone"/>
  <text x="58" y="114" class="lbl">MEMBER ASSISTANT &#183; in both branded portals (/member, /bank)</text>

  <rect x="58" y="128" width="554" height="64" class="box" fill="#defbe6" stroke="#198038"/>
  <text x="72" y="152" class="bt">AssistDock (shared React widget)</text>
  <text x="72" y="170" class="bd">Floating launcher, brand accent per portal, starter chips, typing indicator,</text>
  <text x="72" y="184" class="bd">follow-up chips under the latest answer, honesty note always visible</text>

  <rect x="58" y="212" width="554" height="88" class="box" fill="#24a148" stroke="#198038"/>
  <text x="72" y="236" class="wt">POST /api/assist &#183; { industry, memberId, messages }</text>
  <text x="72" y="256" class="gd">The browser sends ONLY the conversation and the signed-in member id. All grounding is</text>
  <text x="72" y="271" class="gd">assembled server-side, so cross-member data can never reach the client. Direct Azure</text>
  <text x="72" y="286" class="gd">OpenAI REST call (api-version 2024-10-21), JSON response format, temp 0.3</text>

  <rect x="58" y="320" width="270" height="130" class="box" fill="#ffffff" stroke="#198038"/>
  <text x="72" y="344" class="bt">Server-side context assembly</text>
  <text x="72" y="364" class="bd">This member's records only (corpus +</text>
  <text x="72" y="379" class="bd">runtime intake), compacted: incident or</text>
  <text x="72" y="394" class="bd">loan ask, vehicle, photo/document</text>
  <text x="72" y="409" class="bd">evidenceAssessment, documents; plus a</text>
  <text x="72" y="424" class="bd">stage-by-stage journey from the journal</text>
  <text x="72" y="439" class="bd">with estimates and decisions surfaced</text>

  <rect x="342" y="320" width="270" height="130" class="box" fill="#fff1f1" stroke="#da1e28"/>
  <text x="356" y="344" class="bt">Member guardrails</text>
  <text x="356" y="364" class="bd">Fraud stages appear only as "routine</text>
  <text x="356" y="379" class="bd">review"; their outputs are never in the</text>
  <text x="356" y="394" class="bd">context, so they cannot leak even under</text>
  <text x="356" y="409" class="bd">prompt injection. No other members, no</text>
  <text x="356" y="424" class="bd">invented facts, off-account questions</text>
  <text x="356" y="439" class="bd">redirect to the care line</text>

  <rect x="58" y="470" width="554" height="70" class="box" fill="#f4f4f4" stroke="#8d8d8d"/>
  <text x="72" y="494" class="bt">Verified live</text>
  <text x="72" y="512" class="bd">Estimate + photo assessment answered with exact journal figures; fraud probe refused;</text>
  <text x="72" y="526" class="bd">payslip figures quoted verbatim on the banking side; queued claims described honestly</text>

  <!-- Copilot column -->
  <rect x="650" y="90" width="590" height="470" class="zone"/>
  <text x="668" y="114" class="lbl">OPERATOR COPILOT &#183; platform console, every page</text>

  <rect x="668" y="128" width="554" height="64" class="box" fill="#edf5ff" stroke="#0f62fe"/>
  <text x="682" y="152" class="bt">CopilotDock (console-branded widget)</text>
  <text x="682" y="170" class="bd">Source chips show which tools grounded each answer; subject ids deep-link into</text>
  <text x="682" y="184" class="bd">Decision Mode; follow-up chips drill into subjects or the other use case</text>

  <rect x="668" y="212" width="554" height="88" class="box" fill="#0f62fe" stroke="#0a4fd0"/>
  <text x="682" y="236" class="wt">POST /api/copilot &#183; a real Microsoft Agent Framework agent</text>
  <text x="682" y="256" class="wd">ChatClientAgent on the SAME runtime that powers the digital workers (Agent Framework</text>
  <text x="682" y="271" class="wd">1.13), with three governed AIFunction tools. The model chooses the tool per question;</text>
  <text x="682" y="286" class="wd">every call is captured and returned as toolsUsed for the source chips</text>

  <rect x="668" y="320" width="172" height="130" class="box" fill="#f6f2ff" stroke="#8a3ffc"/>
  <text x="682" y="344" class="bt">query_journal</text>
  <text x="682" y="364" class="bd">Operational state:</text>
  <text x="682" y="379" class="bd">open gates, latest</text>
  <text x="682" y="394" class="bd">stage per subject,</text>
  <text x="682" y="409" class="bd">runs per worker,</text>
  <text x="682" y="424" class="bd">avg confidence</text>

  <rect x="856" y="320" width="172" height="130" class="box" fill="#edf5ff" stroke="#0f62fe"/>
  <text x="870" y="344" class="bt">query_records</text>
  <text x="870" y="364" class="bd">Subject digests across</text>
  <text x="870" y="379" class="bd">both use cases with</text>
  <text x="870" y="394" class="bd">text filtering; includes</text>
  <text x="870" y="409" class="bd">evidence assessments</text>
  <text x="870" y="424" class="bd">and documents</text>

  <rect x="1044" y="320" width="178" height="130" class="box" fill="#e5f6ff" stroke="#1192e8"/>
  <text x="1058" y="344" class="bt">ask_fabric_data_agent</text>
  <text x="1058" y="364" class="bd">Portfolio analytics</text>
  <text x="1058" y="379" class="bd">delegated to the</text>
  <text x="1058" y="394" class="bd">published Fabric IQ</text>
  <text x="1058" y="409" class="bd">Data Agent (inline</text>
  <text x="1058" y="424" class="bd">answers enforced)</text>

  <rect x="668" y="470" width="554" height="70" class="box" fill="#f4f4f4" stroke="#8d8d8d"/>
  <text x="682" y="494" class="bt">Entitlement inverts here</text>
  <text x="682" y="512" class="bd">The operations team IS entitled to fraud detail; answers cite subject ids and the tools</text>
  <text x="682" y="526" class="bd">that grounded them. Verified: gates, evidence lists, and real portfolio counts by incident type</text>

  <!-- shared strip -->
  <rect x="40" y="584" width="1200" height="140" rx="12" fill="#161616" stroke="#000000" stroke-width="1.5"/>
  <text x="58" y="610" font-size="12" font-weight="700" letter-spacing=".08em" fill="#c6c6c6">SHARED FOUNDATION</text>
  <text x="58" y="634" font-size="13" fill="#ffffff">gpt-4o on Azure OpenAI &#183; one structured response per turn: {"reply", "followUps"} so contextual next questions cost zero extra calls</text>
  <text x="58" y="656" font-size="13" fill="#ffffff">SDK routing per the platform rule: raw REST for plain completions (member assist, vision) &#183; Agent Framework for tool-calling agents (copilot, workers)</text>
  <text x="58" y="678" font-size="13" fill="#ffffff">Both degrade gracefully (unavailable = honest error, never a fake answer) &#183; all data synthetic, stated in the UI</text>
  <text x="58" y="706" font-size="11" fill="#a8a8a8">Positioned next: the /copilot contract exposed as a Microsoft 365 Copilot declarative agent (Copilot Studio / M365 Agents SDK) once tenant licensing + consent land</text>

  <!-- flows -->
  <path class="gflow" d="M335,192 L335,212"/>
  <path class="gflow" d="M193,300 L193,320"/>
  <path class="gflow" d="M477,300 L477,320"/>
  <path class="flow" d="M945,192 L945,212"/>
  <path class="flow" d="M754,300 L754,320"/>
  <path class="flow" d="M942,300 L942,320"/>
  <path class="flow" d="M1133,300 L1133,320"/>
</svg>
