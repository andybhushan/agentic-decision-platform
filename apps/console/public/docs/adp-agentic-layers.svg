<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 880" font-family="'IBM Plex Sans','Segoe UI',system-ui,sans-serif">
  <defs>
    <marker id="ga" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#525252"/></marker>
    <style>
      .layer{rx:12;fill:#ffffff;stroke:#c5d2e3;stroke-width:1.5}
      .lbl{font-size:12px;font-weight:700;letter-spacing:.08em;fill:#5b6b7c}
      .box{rx:8;stroke-width:1.5}
      .bt{font-size:13px;font-weight:600;fill:#161616}
      .bd{font-size:10.5px;fill:#6b7682}
      .wt{font-size:13px;font-weight:600;fill:#ffffff}
      .wd{font-size:10.5px;fill:#e8efff}
      .chip{rx:12;fill:#edf5ff;stroke:#0f62fe;stroke-width:1.2}
      .ct{font-size:11px;font-weight:600;fill:#0043ce}
      .flow{stroke:#525252;stroke-width:1.6;fill:none;marker-end:url(#ga)}
      .note{font-size:11px;fill:#6b7682;font-style:italic}
    </style>
  </defs>
  <rect width="1280" height="880" fill="#fbfcfe"/>
  <text x="40" y="42" font-size="22" font-weight="700" fill="#161616">Agentic layers: from a human surface down to the model, seven layers</text>
  <text x="40" y="64" font-size="13" fill="#6b7682">Each layer only knows the one below it. Domain knowledge enters only at layer 3 (the package); everything underneath is use-case agnostic platform.</text>

  <!-- L1 -->
  <rect x="40" y="88" width="1030" height="86" class="layer"/>
  <text x="58" y="112" class="lbl">L1 &#183; EXPERIENCE &#8212; humans act on branded surfaces</text>
  <rect x="58" y="122" width="300" height="40" class="box" fill="#defbe6" stroke="#198038"/>
  <text x="72" y="147" class="bt">Member + borrower portals (use-case views)</text>
  <rect x="374" y="122" width="300" height="40" class="box" fill="#edf5ff" stroke="#0f62fe"/>
  <text x="388" y="147" class="bt">Operator console (platform view)</text>
  <rect x="690" y="122" width="360" height="40" class="box" fill="#f4f4f4" stroke="#8d8d8d"/>
  <text x="704" y="147" class="bt">Leadership surfaces: Outcomes, Decision Record, Docs</text>

  <!-- L2 -->
  <rect x="40" y="198" width="1030" height="86" class="layer"/>
  <text x="58" y="222" class="lbl">L2 &#183; ORCHESTRATION &#8212; Durable Functions runs the plan</text>
  <rect x="58" y="232" width="310" height="40" class="box" fill="#0f62fe" stroke="#0a4fd0"/>
  <text x="72" y="257" class="wt">Plan executor walks the package's steps</text>
  <rect x="384" y="232" width="330" height="40" class="box" fill="#0f62fe" stroke="#0a4fd0"/>
  <text x="398" y="257" class="wt">Suspends at HITL gates, resumes on judgment</text>
  <rect x="730" y="232" width="320" height="40" class="box" fill="#0f62fe" stroke="#0a4fd0"/>
  <text x="744" y="257" class="wt">Journals every step before moving on</text>

  <!-- L3 -->
  <rect x="40" y="308" width="1030" height="118" class="layer"/>
  <text x="58" y="332" class="lbl">L3 &#183; DIGITAL WORKERS &#8212; the use case's staged lifecycle (from the signed package; the only domain-aware layer)</text>
  <rect x="58" y="344" width="190" height="66" class="box" fill="#e5f6ff" stroke="#1192e8"/>
  <text x="70" y="366" class="bt">FNOL Handler</text>
  <text x="70" y="384" class="bd">Intake &amp; Routing &#183; 4 agents</text>
  <rect x="260" y="344" width="190" height="66" class="box" fill="#e5f6ff" stroke="#1192e8"/>
  <text x="272" y="366" class="bt">Damage Handler</text>
  <text x="272" y="384" class="bd">Damage &amp; Estimation &#183; 4</text>
  <rect x="462" y="344" width="190" height="66" class="box" fill="#e5f6ff" stroke="#1192e8"/>
  <text x="474" y="366" class="bt">Fraud Handler</text>
  <text x="474" y="384" class="bd">Fraud Screen &#183; 4 agents</text>
  <rect x="664" y="344" width="190" height="66" class="box" fill="#e5f6ff" stroke="#1192e8"/>
  <text x="676" y="366" class="bt">Settlement Handler</text>
  <text x="676" y="384" class="bd">Settlement &amp; Payment &#183; 4</text>
  <rect x="866" y="344" width="184" height="66" class="box" fill="#f6f2ff" stroke="#8a3ffc"/>
  <text x="878" y="366" class="bt">Loan Handler</text>
  <text x="878" y="384" class="bd">Origination &#183; 3 agents</text>

  <!-- L4 -->
  <rect x="40" y="450" width="1030" height="110" class="layer"/>
  <text x="58" y="474" class="lbl">L4 &#183; AGENTS &#8212; every step is the same governed loop</text>
  <rect x="58" y="486" width="176" height="58" class="chip"/>
  <text x="74" y="510" class="ct">1 &#183; Ground</text>
  <text x="74" y="527" font-size="10" fill="#5b6b7c">retrieve via IQ federation</text>
  <rect x="250" y="486" width="176" height="58" class="chip"/>
  <text x="266" y="510" class="ct">2 &#183; Reason</text>
  <text x="266" y="527" font-size="10" fill="#5b6b7c">gpt-4o with cited context</text>
  <rect x="442" y="486" width="176" height="58" class="chip"/>
  <text x="458" y="510" class="ct">3 &#183; Act</text>
  <text x="458" y="527" font-size="10" fill="#5b6b7c">tool calls, all journaled</text>
  <rect x="634" y="486" width="176" height="58" class="chip"/>
  <text x="650" y="510" class="ct">4 &#183; Score</text>
  <text x="650" y="527" font-size="10" fill="#5b6b7c">calibrated confidence</text>
  <rect x="826" y="486" width="224" height="58" class="chip"/>
  <text x="842" y="510" class="ct">5 &#183; Journal (or gate to a human)</text>
  <text x="842" y="527" font-size="10" fill="#5b6b7c">below threshold = organic HITL</text>

  <!-- L5 -->
  <rect x="40" y="584" width="1030" height="86" class="layer"/>
  <text x="58" y="608" class="lbl">L5 &#183; SKILLS + TOOLS &#8212; industry-aware registry composes per-use-case kits</text>
  <rect x="58" y="618" width="480" height="40" class="box" fill="#ffffff" stroke="#8d8d8d"/>
  <text x="72" y="643" class="bt">MCP tools bridged as AIFunctions, every call journaled</text>
  <rect x="554" y="618" width="496" height="40" class="box" fill="#ffffff" stroke="#8d8d8d"/>
  <text x="568" y="643" class="bt">Meridian kit (claims) &#183; Northwind kit (lending): one line to register a new kit</text>

  <!-- L6 -->
  <rect x="40" y="694" width="1030" height="86" class="layer"/>
  <text x="58" y="718" class="lbl">L6 &#183; ADAPTERS &#8212; one PromptContract, three swappable runtimes (AGENT_BACKEND)</text>
  <rect x="58" y="728" width="310" height="40" class="box" fill="#24a148" stroke="#198038"/>
  <text x="72" y="753" class="wt">Microsoft Agent Framework &#183; ACTIVE</text>
  <rect x="384" y="728" width="330" height="40" class="box" fill="#f4f4f4" stroke="#8d8d8d"/>
  <text x="398" y="753" class="bt">Azure AI Foundry Agent Service &#183; prepared</text>
  <rect x="730" y="728" width="320" height="40" class="box" fill="#f4f4f4" stroke="#8d8d8d"/>
  <text x="744" y="753" class="bt">Legacy Azure OpenAI &#183; fallback</text>

  <!-- L7 -->
  <rect x="40" y="804" width="1030" height="56" rx="12" fill="#161616" stroke="#000000" stroke-width="1.5"/>
  <text x="58" y="828" font-size="12" font-weight="700" letter-spacing=".08em" fill="#c6c6c6">L7 &#183; MODEL</text>
  <text x="58" y="848" font-size="13" fill="#ffffff">gpt-4o: agent reasoning + damage-photo vision &#183; embeddings for vector retrieval &#183; served by Azure OpenAI</text>

  <!-- side rail -->
  <rect x="1090" y="88" width="150" height="772" rx="12" fill="#f6f2ff" stroke="#8a3ffc" stroke-width="1.5"/>
  <text x="1106" y="112" font-size="11" font-weight="700" letter-spacing=".06em" fill="#6d28d0">CROSS-CUTTING</text>
  <text x="1106" y="140" font-size="12" font-weight="600" fill="#161616">Immutable</text>
  <text x="1106" y="156" font-size="12" font-weight="600" fill="#161616">journal</text>
  <text x="1106" y="176" font-size="10.5" fill="#6b7682">every layer's events</text>
  <text x="1106" y="216" font-size="12" font-weight="600" fill="#161616">Citations</text>
  <text x="1106" y="236" font-size="10.5" fill="#6b7682">source, doc, score</text>
  <text x="1106" y="252" font-size="10.5" fill="#6b7682">persist end to end</text>
  <text x="1106" y="292" font-size="12" font-weight="600" fill="#161616">Confidence</text>
  <text x="1106" y="312" font-size="10.5" fill="#6b7682">scored per step,</text>
  <text x="1106" y="328" font-size="10.5" fill="#6b7682">gates below the</text>
  <text x="1106" y="344" font-size="10.5" fill="#6b7682">package threshold</text>
  <text x="1106" y="384" font-size="12" font-weight="600" fill="#161616">Identity</text>
  <text x="1106" y="404" font-size="10.5" fill="#6b7682">Entra Agent ID</text>
  <text x="1106" y="420" font-size="10.5" fill="#6b7682">declared per worker</text>
  <text x="1106" y="460" font-size="12" font-weight="600" fill="#161616">Telemetry</text>
  <text x="1106" y="480" font-size="10.5" fill="#6b7682">App Insights +</text>
  <text x="1106" y="496" font-size="10.5" fill="#6b7682">Log Analytics</text>
  <text x="1106" y="536" font-size="12" font-weight="600" fill="#161616">Live tail</text>
  <text x="1106" y="556" font-size="10.5" fill="#6b7682">SignalR streams</text>
  <text x="1106" y="572" font-size="10.5" fill="#6b7682">steps to the console</text>
  <text x="1106" y="608" font-size="12" font-weight="600" fill="#161616">SLOs</text>
  <text x="1106" y="628" font-size="10.5" fill="#6b7682">declared in the</text>
  <text x="1106" y="644" font-size="10.5" fill="#6b7682">package, observed</text>
  <text x="1106" y="660" font-size="10.5" fill="#6b7682">in Outcomes</text>

  <!-- arrows -->
  <path class="flow" d="M555,174 L555,198"/>
  <path class="flow" d="M555,284 L555,308"/>
  <path class="flow" d="M555,426 L555,450"/>
  <path class="flow" d="M555,560 L555,584"/>
  <path class="flow" d="M555,670 L555,694"/>
  <path class="flow" d="M555,780 L555,804"/>
</svg>
