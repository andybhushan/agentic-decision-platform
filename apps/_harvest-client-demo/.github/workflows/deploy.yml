# deploy.yml — PROJECT IMAGINE zero-touch deployment to Azure
# Triggers on push to master
# Provisions infrastructure (azd provision) then deploys both services (azd deploy)
#
# Required GitHub Secrets:
#   AZURE_CLIENT_ID        — Federated identity client ID (OIDC)
#   AZURE_TENANT_ID        — Azure tenant ID
#   AZURE_SUBSCRIPTION_ID  — sub-ibmc-projImagine-demo
#
# Required GitHub Variables:
#   AZURE_ENV_NAME         — 'demo'
#   AZURE_LOCATION         — 'uksouth'
#
# One-time setup (run locally):
#   az ad app create --display-name "project-imagine-deploy"
#   az ad sp create --id <appId>
#   az role assignment create --role Contributor --assignee <spObjectId> \
#     --scope /subscriptions/<subId>/resourceGroups/rg-project-imagine
#   az ad app federated-credential create --id <appId> --parameters '{"name":"github","issuer":"https://token.actions.githubusercontent.com","subject":"repo:richardichogan/agent-workflow-builder:ref:refs/heads/master","audiences":["api://AzureADTokenExchange"]}'

name: Deploy to Azure

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  id-token: write   # OIDC federated login
  contents: read

env:
  AZURE_ENV_NAME: ${{ vars.AZURE_ENV_NAME || 'demo' }}
  AZURE_LOCATION: ${{ vars.AZURE_LOCATION || 'uksouth' }}
  AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

jobs:
  deploy:
    name: Provision & Deploy
    runs-on: ubuntu-latest
    environment: demo

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json   # monorepo: lock file lives at repo root

      - name: Install azd
        uses: azure/setup-azd@v2

      - name: Log in to Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: azd auth (reuse az login token)
        run: azd auth login --federated-credential-provider github

      - name: azd env set
        run: |
          azd env new ${{ env.AZURE_ENV_NAME }} --no-prompt || azd env select ${{ env.AZURE_ENV_NAME }}
          azd env set AZURE_LOCATION ${{ env.AZURE_LOCATION }}
          azd env set AZURE_SUBSCRIPTION_ID ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: azd provision (infrastructure)
        run: azd provision --no-prompt
        env:
          AZURE_ENV_NAME: ${{ env.AZURE_ENV_NAME }}
          AZURE_LOCATION: ${{ env.AZURE_LOCATION }}
          AZURE_SUBSCRIPTION_ID: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: azd deploy (application)
        run: azd deploy --no-prompt
        env:
          AZURE_ENV_NAME: ${{ env.AZURE_ENV_NAME }}
          AZURE_LOCATION: ${{ env.AZURE_LOCATION }}
          AZURE_SUBSCRIPTION_ID: ${{ env.AZURE_SUBSCRIPTION_ID }}
