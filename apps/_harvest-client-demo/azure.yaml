# azure.yaml — PROJECT IMAGINE AZD configuration
name: project-imagine

metadata:
  template: azd-init

services:
  api:
    project: ./backend
    language: ts
    host: containerapp
    docker:
      path: ./backend/Dockerfile
      context: ./backend

  web:
    project: ./frontend
    language: js
    host: staticwebapp
    dist: dist
